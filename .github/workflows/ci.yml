name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: portfolio_test_ci
          MYSQL_USER: portfolio_test
          MYSQL_PASSWORD: ci-only-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:integration:mysql
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: portfolio_test
          TEST_DB_PASSWORD: ci-only-test-password
          TEST_DB_NAME: portfolio_test_ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:documents
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: portfolio_test
          TEST_DB_PASSWORD: ci-only-test-password
          TEST_DB_NAME: portfolio_test_ci
          AUTH_E2E_LOG: /tmp/portfolio-ci-auth-audit.log
